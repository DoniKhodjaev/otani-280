<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отани 280</title>
<meta name="theme-color" content="#0e6a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Отани">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f1f4f3; --surface:#ffffff; --ink:#15211d; --muted:#5b6a65; --line:#d5ddd9;
  --accent:#0e6a4e; --accent-soft:#dcefe7; --on-accent:#ffffff; --warn:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f1513; --surface:#18201d; --ink:#e7edea; --muted:#94a39d; --line:#2b3632;
  --accent:#4cc299; --accent-soft:#17352b; --on-accent:#08130f; --warn:#ff8a80; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:1.45rem;margin:0;font-weight:800;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.9rem;margin-top:2px}
.streak{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.streak b{display:block;font-size:1.5rem;color:var(--accent);line-height:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px;border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.progress{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0;font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.task input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;margin:0;display:grid;place-items:center}
.task input:checked{background:var(--accent);border-color:var(--accent)}
.task input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-1px)}
.task input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task.core{border-color:var(--accent)}
.task.done span{color:var(--muted);text-decoration:line-through}
.task small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.task small.late{color:var(--warn);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.card p{margin:0}
.btn{appearance:none;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;padding:12px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5}
.status{color:var(--muted);font-size:.84rem}
.mandala{display:grid;grid-template-columns:1fr;gap:16px}
.block{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 5px;min-height:92px;font-size:.72rem;line-height:1.25;
  display:flex;align-items:center;justify-content:center;text-align:center;hyphens:auto;overflow-wrap:anywhere}
.cell.dir{background:var(--accent-soft);border-color:var(--accent);font-weight:800;font-size:.8rem;hyphens:manual}
.cell.goal{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800;font-size:.95rem;flex-direction:column;gap:2px}
.cell.goal small{font-weight:500;font-size:.7rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>План на сегодня</h1><div class="date" id="date"></div></div>
    <div class="streak"><b id="streak">0</b>дней подряд</div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true">Сегодня</button>
    <button role="tab" id="tab-table" aria-selected="false">Таблица</button>
  </div>

  <section id="view-today">
    <div class="wrap" style="padding:0;gap:14px">
      <div class="progress"><span id="ptext">Загружаю задачи…</span><div class="bar"><i id="pbar"></i></div></div>
      <div id="tasks" class="wrap" style="padding:0;gap:8px"></div>
      <div class="card" id="push">
        <p><b>Уведомления в 6:30</b></p>
        <p class="status" id="pstatus">Проверяю…</p>
        <button class="btn" id="penable" hidden>Включить уведомления</button>
        <button class="btn ghost" id="ptest" hidden>Прислать тестовое сейчас</button>
      </div>
    </div>
  </section>

  <section id="view-table" hidden>
    <div class="mandala" id="mandala"></div>
  </section>
</div>

<script>
"use strict";
var FN = "https://dcneuqtjulqyvtfslopa.supabase.co/functions/v1/otani-push";
var VAPID = "BMLW9NOBnvXL5yBfWJMDb4tZwx4o7xMeYaQKQgMaUVspAewY1KZiZQbYXpehvx0FJbwhjU-KnDytprbWNQny0S8";
var $ = function (id) { return document.getElementById(id); };
var TASKS = null;

/* ---------- storage ---------- */
function load(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
var days = load("otani-days", {});      // { "2026-11-10": ["id", ...] }
var dlDone = load("otani-dl", []);      // done deadline ids

/* ---------- dates ---------- */
function pad(n) { return (n < 10 ? "0" : "") + n; }
function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "t" + (h >>> 0).toString(36); }

/* ---------- day building ---------- */
function buildDay(d) {
  var list = (TASKS.weekday[String(d.getDay())] || []).slice();
  if (d.getDate() === 1) list = list.concat(TASKS.monthly1 || []);
  return list.map(function (t) { return { t: t.t, g: t.g, core: !!t.core, id: hash(t.t) }; });
}
function coreDone(d) {
  var list = buildDay(d).filter(function (t) { return t.core; });
  var done = days[key(d)] || [];
  return list.length > 0 && list.every(function (t) { return done.indexOf(t.id) >= 0; });
}
function streak() {
  var d = new Date(), n = 0;
  if (!coreDone(d)) d = addDays(d, -1);
  while (n < 400 && coreDone(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- render today ---------- */
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function taskRow(text, checked, cls, note, noteCls, onChange) {
  var row = el("label", "task" + (cls ? " " + cls : "") + (checked ? " done" : ""));
  var cb = el("input"); cb.type = "checkbox"; cb.checked = checked;
  var body = el("div"); body.appendChild(el("span", "", text));
  if (note) body.appendChild(el("small", noteCls || "", note));
  cb.addEventListener("change", function () { onChange(cb.checked); });
  row.appendChild(cb); row.appendChild(body);
  return row;
}
function renderToday() {
  var now = new Date(), k = key(now), done = days[k] || [];
  $("date").textContent = now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  var list = buildDay(now), box = $("tasks");
  box.textContent = "";
  function toggle(id, on) {
    var arr = days[k] || [], i = arr.indexOf(id);
    if (on && i < 0) arr.push(id); if (!on && i >= 0) arr.splice(i, 1);
    days[k] = arr; save("otani-days", days); renderToday();
  }
  function section(title, items) {
    if (!items.length) return;
    box.appendChild(el("h2", "", title));
    var l = el("div", "list");
    items.forEach(function (t) {
      l.appendChild(taskRow(t.t, done.indexOf(t.id) >= 0, t.core ? "core" : "", null, null, function (on) { toggle(t.id, on); }));
    });
    box.appendChild(l);
  }
  section("Главное", list.filter(function (t) { return t.core; }));
  ["Клиенты", "План", "Тело", "Дом"].forEach(function (g) {
    section(g, list.filter(function (t) { return !t.core && t.g === g; }));
  });

  // deadlines: not done, due within 7 days or overdue
  var dls = (TASKS.deadlines || []).map(function (x) {
    var left = Math.round((parseKey(x.d) - parseKey(k)) / 86400000);
    return { t: x.t, d: x.d, left: left, id: hash(x.d + x.t) };
  }).filter(function (x) { return dlDone.indexOf(x.id) < 0 && x.left <= 7; });
  if (dls.length) {
    box.appendChild(el("h2", "", "Сроки"));
    var l = el("div", "list");
    dls.forEach(function (x) {
      var note = x.left < 0 ? "Просрочено на " + (-x.left) + " дн." : x.left === 0 ? "Срок сегодня" : "Осталось " + x.left + " дн.";
      l.appendChild(taskRow(x.t, false, "", note, x.left <= 0 ? "late" : "", function () {
        dlDone.push(x.id); save("otani-dl", dlDone); renderToday();
      }));
    });
    box.appendChild(l);
  }

  var total = list.length, n = list.filter(function (t) { return done.indexOf(t.id) >= 0; }).length;
  $("ptext").textContent = "Сделано " + n + " из " + total;
  $("pbar").style.width = (total ? Math.round(n / total * 100) : 0) + "%";
  $("streak").textContent = streak();
}

/* ---------- tabs ---------- */
function show(tab) {
  var t = tab === "table";
  $("view-today").hidden = t; $("view-table").hidden = !t;
  $("tab-today").setAttribute("aria-selected", String(!t));
  $("tab-table").setAttribute("aria-selected", String(t));
}
$("tab-today").addEventListener("click", function () { show("today"); });
$("tab-table").addEventListener("click", function () { show("table"); });

/* ---------- mandala ---------- */
var M = [
 ["Воронка: новые клиенты", ["Список 50 целевых компаний с оборотом и текущим банком, до 30.11", "5 новых контактов CFO и казначеев в LinkedIn каждый будний вечер", "10 персональных сообщений новым контактам в неделю", "2 первые встречи с новыми компаниями в неделю", "1 звонок знакомому из госбанков в неделю с просьбой познакомить", "Файл воронки обновлён каждую пятницу до 17:00", "1-го числа: сумма воронки не меньше 3× остатка до цели", "Нет ответа: повтор через 7 дней, максимум 3 касания"]],
 ["Анализ клиента", ["Досье на 1 страницу до первой встречи: выручка, долг, банки, собственники", "1 глубокий разбор компании каждую субботу, 1,5 часа", "5 коэффициентов до предложения: Debt/EBITDA, покрытие процентов, ликвидность, маржа, оборотный цикл", "Залоги и действующие кредиты проверены до встречи", "3 письменные гипотезы «что болит у клиента» перед встречей", "10 вопросов на каждую встречу записаны заранее", "Итоги встречи записаны в файл в тот же день", "Сорвалась сделка: 3 причины письменно за 7 дней"]],
 ["Сделки в работе", ["Сделка 1: звонок клиенту раз в 7 дней, пока нет ответа", "Сделка 2: звонок до 4 декабря, получить дату решения", "У каждой сделки записан следующий шаг с датой", "Список документов клиенту в день его согласия", "Заявка на лимит готова за 10 рабочих дней после полного пакета", "Статус по сделкам руководителю каждый понедельник", "Разговор с риск-менеджером до подачи каждой заявки", "Ответ на запрос клиента в течение 24 часов"]],
 ["Предложение и цена", ["Предложение клиенту за 3 рабочих дня после встречи", "В каждом предложении 2 варианта структуры", "Таблица ставок 5 банков-конкурентов, обновление 1-го числа", "На каждой встрече 3 вопроса: ставка, срок, залог в текущем банке", "Зарплатный проект отдельным блоком в каждом предложении", "3 шаблона до 15.12: кредит, гарантия, факторинг", "Экономия клиента в цифрах в каждом предложении", "После отказа: вопрос «что решило?», ответ записан"]],
 ["Связи и репутация", ["Список 30 знакомых из банков и компаний, до 20.11", "1 обед или кофе в неделю с человеком из списка", "Профиль LinkedIn обновлён до 16.11: должность, продукты, фото", "1 пост в LinkedIn в неделю о финансировании бизнеса", "1 отраслевое мероприятие в месяц", "Сообщение с благодарностью за 24 часа после встречи", "У каждого клиента попросить 1 рекомендацию", "Раз в квартал звонок каждому из 20 главных контактов"]],
 ["Тело и энергия", ["Тренировка 30 минут утром, 5 будних дней", "1 час спорта в субботу и 1 час в воскресенье", "8 000 шагов в день", "Взвешивание каждое воскресенье утром, запись", "В кровати до 23:30 в будни", "1,5 литра воды в день", "Фастфуд и сладкие напитки не чаще 1 раза в неделю", "Спортивная форма приготовлена с вечера"]],
 ["Дисциплина и план", ["План недели каждое воскресенье, 30 минут", "3 главные задачи дня записаны до 9:30", "Самое неприятное дело сделано до 11:00", "Аниме и сериалы только после вечерних 30 минут", "Отметка каждый вечер: утро и вечер сделаны", "Не больше 1 пропуска подряд", "Никаких новых привычек до 8 декабря", "1-го числа обзор месяца: факт против цели"]],
 ["Дом и семья", ["Бюджет и срок ремонта согласованы с женой до 30.11", "Смета ремонта по комнатам до 15.12", "3 предложения от бригад до 31.12", "30 минут на ремонт каждое воскресенье", "Расходы семьи записаны раз в неделю", "50% каждого квартального бонуса в фонд ремонта", "1 вечер в неделю с женой без телефонов", "Помощь жене с работой: до 2 часов в неделю в выбранный заранее слот"]]
];
(function () {
  var m = $("mandala"), cb = el("div", "block"), i, k = 0;
  for (i = 0; i < 9; i++) {
    if (i === 4) { var g = el("div", "cell goal", "Цель года"); g.appendChild(el("small", "", "10–15 клиентов")); cb.appendChild(g); }
    else cb.appendChild(el("div", "cell dir", M[k++][0]));
  }
  m.appendChild(cb);
  M.forEach(function (d) {
    var b = el("div", "block"), j = 0;
    for (var i = 0; i < 9; i++) b.appendChild(i === 4 ? el("div", "cell dir", d[0]) : el("div", "cell", d[1][j++]));
    m.appendChild(b);
  });
})();

/* ---------- push ---------- */
function b64ToBytes(s) {
  var p = "=".repeat((4 - s.length % 4) % 4), raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
  var out = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out;
}
function api(body) {
  return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ("Ошибка " + r.status)); return j; }); });
}
var swReg = null;
function pushUI(sub, msg) {
  var st = $("pstatus"), en = $("penable"), te = $("ptest");
  if (msg) st.textContent = msg;
  en.hidden = !!sub; te.hidden = !sub;
  if (sub && !msg) st.textContent = "Включены. Каждый день в 6:30 придёт список задач.";
}
function initPush() {
  var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!("serviceWorker" in navigator)) { $("pstatus").textContent = "Этот браузер не поддерживает уведомления."; return; }
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    swReg = reg;
    if (!("PushManager" in window) || !("Notification" in window)) {
      $("pstatus").textContent = ios && !standalone
        ? "На iPhone: в Safari нажми «Поделиться» → «На экран „Домой“», открой приложение с экрана и включи уведомления здесь."
        : "Этот браузер не поддерживает уведомления.";
      return;
    }
    return reg.pushManager.getSubscription().then(function (sub) {
      if (sub) { api({ action: "subscribe", sub: sub.toJSON() }).catch(function () {}); pushUI(sub); }
      else pushUI(null, Notification.permission === "denied"
        ? "Уведомления запрещены. Разреши их в настройках телефона для этого приложения."
        : "Выключены. Нажми кнопку, чтобы получать список задач каждое утро.");
      if (Notification.permission === "denied") $("penable").hidden = true;
    });
  }).catch(function (e) { $("pstatus").textContent = "Не удалось запустить фоновую часть: " + e.message; });
}
$("penable").addEventListener("click", function () {
  var btn = this; btn.disabled = true;
  Notification.requestPermission().then(function (p) {
    if (p !== "granted") throw new Error("Разрешение не выдано.");
    return swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID) });
  }).then(function (sub) {
    return api({ action: "subscribe", sub: sub.toJSON() }).then(function () { pushUI(sub); });
  }).catch(function (e) { pushUI(null, "Не получилось: " + e.message); })
    .then(function () { btn.disabled = false; });
});
$("ptest").addEventListener("click", function () {
  var btn = this; btn.disabled = true;
  swReg.pushManager.getSubscription().then(function (sub) {
    if (!sub) throw new Error("Подписка не найдена, включи уведомления заново.");
    return api({ action: "test", endpoint: sub.endpoint });
  }).then(function () { $("pstatus").textContent = "Отправлено. Уведомление придёт через несколько секунд."; })
    .catch(function (e) { $("pstatus").textContent = "Не получилось: " + e.message; })
    .then(function () { btn.disabled = false; });
});

/* ---------- start ---------- */
fetch("tasks.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (t) {
  TASKS = t; renderToday();
}).catch(function () { $("ptext").textContent = "Не удалось загрузить задачи. Проверь интернет и открой снова."; });
document.addEventListener("visibilitychange", function () { if (!document.hidden && TASKS) renderToday(); });
initPush();
</script>
</body>
</html>
