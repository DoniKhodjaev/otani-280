<style>
/* Лист школьной тетради: линованные строки, красное поле, синяя паста, жёлтый маркер на главном */
:root{
  --paper:#fbfcfe; --ink:#1b2a4a; --muted:#6b7896; --rule:#cdd9ec; --margin:#d9443f; --mark:#ffe45c; --on-ink:#fbfcfe;
  --body:"Onest",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --display:"Unbounded","Onest",-apple-system,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#141c2e; --ink:#e6ecf8; --muted:#8e9bb8; --rule:#2a3653; --margin:#e0635f; --mark:#6a5a14; --on-ink:#141c2e; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.35 var(--body);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{padding:18px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.narrow{max-width:640px;margin:0 auto}

.top{display:grid;grid-template-columns:auto 1fr auto;align-items:end;column-gap:12px}
.daynum{font:900 4.4rem/.82 var(--display);letter-spacing:-.04em}
.daymeta{font-size:1.05rem;line-height:1.2;padding-bottom:2px}
.daymeta div:first-child{font-weight:700}
.run{text-align:right;font-size:.82rem;color:var(--muted);padding-bottom:2px}
.week{display:flex;gap:3px;justify-content:flex-end;margin-bottom:5px}
.week i{width:13px;height:13px;border:1.5px solid var(--ink)}
.week i.on{background:var(--ink)}
.week i.today{border-color:var(--margin)}
.week i.today.on{background:var(--margin)}

.tabs{display:flex;gap:22px;margin-top:22px;border-bottom:1.5px solid var(--ink)}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 1rem var(--body);padding:8px 0 9px;margin-bottom:-1.5px;border-bottom:4px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--margin);outline-offset:3px}

.tally{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.88rem;color:var(--muted)}
.cellsrow{display:flex;gap:3px;flex-wrap:wrap}
.cellsrow i{width:16px;height:16px;border:1.5px solid var(--ink)}
.cellsrow i.on{background:var(--ink)}

.sheet{position:relative;margin-top:6px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:38px;width:1.5px;background:var(--margin);opacity:.75}
.sheet h2{font:700 1.05rem var(--body);margin:0;padding:22px 0 8px 50px;border-bottom:1px solid var(--rule)}
.task{display:grid;grid-template-columns:38px 1fr;column-gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.task input{appearance:none;width:20px;height:20px;margin:1px 0 0;justify-self:center;border:1.5px solid var(--ink);border-radius:3px;position:relative;background:var(--paper)}
.task input:checked::after{content:"";position:absolute;left:5px;top:-5px;width:8px;height:17px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.task input:focus-visible{outline:2px solid var(--margin);outline-offset:2px}
.task.core span{font-weight:600;background:linear-gradient(transparent 52%,var(--mark) 52%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.task.done span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.task small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.task small.late{color:var(--margin);font-weight:700}

.note{padding:22px 0 0 50px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.note p{margin:0}
.note .title{font-weight:700;font-size:1.05rem}
.status{color:var(--muted)}
.btn{appearance:none;border:1.5px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--on-ink);font:700 1rem var(--body);padding:12px 14px;text-align:left}
.btn.ghost{background:none;color:var(--ink)}
.btn:disabled{opacity:.5}

.mandala{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
.block{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--ink)}
.cell{border:.5px solid var(--rule);padding:8px 5px;min-height:92px;font-size:.74rem;line-height:1.25;
  display:flex;align-items:center;justify-content:center;text-align:center;hyphens:auto;overflow-wrap:anywhere}
.cell.dir{background:var(--mark);font-weight:700;font-size:.8rem;hyphens:manual}
.cell.goal{background:var(--ink);color:var(--on-ink);font:700 .9rem var(--display);flex-direction:column;gap:4px}
.cell.goal small{font:400 .72rem var(--body)}
@media (min-width:1000px){
  .mandala{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"a b c" "d z e" "f g h";gap:8px;max-width:1400px;margin-inline:auto}
  .block{grid-area:var(--area)}
}
@media (prefers-reduced-motion:no-preference){ .cellsrow i,.week i{transition:background .15s} }
[hidden]{display:none!important}
</style>

<body>
<div class="wrap">
  <div class="narrow">
    <header class="top">
      <div class="daynum" id="daynum"></div>
      <div class="daymeta"><div id="dayname"></div><div id="month"></div></div>

        <button class="btn ghost" id="ptest" hidden>Прислать тестовое сейчас</button>

    </div>

  <section id="view-table" hidden>
    <div class="mandala" id="mandala"></div>
  </section>
</div>

<script>
"use strict";

var TASKS = null;

/* ---------- storage ---------- */
function load(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
var days = load("otani-days", {});      // { "2026-11-10": ["id", ...] }

/* ---------- dates ---------- */
function pad(n) { return (n < 10 ? "0" : "") + n; }
function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "t" + (h >>> 0).toString(36); }

/* ---------- day building ---------- */
function buildDay(d) {
  var list = (TASKS.weekday[String(d.getDay())] || []).slice();
  if (d.getDate() === 1) list = list.concat(TASKS.monthly1 || []);
  return list.map(function (t) { return { t: t.t, g: t.g, core: !!t.core, id: hash(t.t) }; });
}
function coreDone(d) {
  var list = buildDay(d).filter(function (t) { return t.core; });
  var done = days[key(d)] || [];
  return list.length > 0 && list.every(function (t) { return done.indexOf(t.id) >= 0; });
}
function streak() {
  var d = new Date(), n = 0;
  if (!coreDone(d)) d = addDays(d, -1);
  while (n < 400 && coreDone(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- render today ---------- */
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function taskRow(text, checked, cls, note, noteCls, onChange) {
  var row = el("label", "task" + (cls ? " " + cls : "") + (checked ? " done" : ""));
  var cb = el("input"); cb.type = "checkbox"; cb.checked = checked;
  var body = el("div"); body.appendChild(el("span", "", text));
  if (note) body.appendChild(el("small", noteCls || "", note));
  cb.addEventListener("change", function () { onChange(cb.checked); });
  row.appendChild(cb); row.appendChild(body);
  return row;
}
function renderToday() {
  var now = new Date(), k = key(now), done = days[k] || [];
  $("daynum").textContent = now.getDate();
  $("dayname").textContent = now.toLocaleDateString("ru-RU", { weekday: "long" });
  $("month").textContent = now.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }).replace(/^\d+\s*/, "");
  var list = buildDay(now), box = $("tasks");
  box.textContent = "";
  function toggle(id, on) {
    var arr = days[k] || [], i = arr.indexOf(id);
    if (on && i < 0) arr.push(id); if (!on && i >= 0) arr.splice(i, 1);
    days[k] = arr; save("otani-days", days); renderToday();
  }
  function section(title, items) {
    if (!items.length) return;
    box.appendChild(el("h2", "", title));
    var l = el("div", "list");
    items.forEach(function (t) {
      l.appendChild(taskRow(t.t, done.indexOf(t.id) >= 0, t.core ? "core" : "", null, null, function (on) { toggle(t.id, on); }));
    });
    box.appendChild(l);
  }
  section("Главное", list.filter(function (t) { return t.core; }));
  ["Клиенты", "План", "Тело", "Дом"].forEach(function (g) {
    section(g, list.filter(function (t) { return !t.core && t.g === g; }));
  });

  // deadlines: not done, due within 7 days or overdue
  var dls = (TASKS.deadlines || []).map(function (x) {
    var left = Math.round((parseKey(x.d) - parseKey(k)) / 86400000);
    return { t: x.t, d: x.d, left: left, id: hash(x.d + x.t) };
  }).filter(function (x) { return dlDone.indexOf(x.id) < 0 && x.left <= 7; });
  if (dls.length) {
    box.appendChild(el("h2", "", "Сроки"));
    var l = el("div", "list");
    dls.forEach(function (x) {
      var note = x.left < 0 ? "Просрочено на " + (-x.left) + " дн." : x.left === 0 ? "Срок сегодня" : "Осталось " + x.left + " дн.";
      l.appendChild(taskRow(x.t, false, "", note, x.left <= 0 ? "late" : "", function () {
        dlDone.push(x.id); save("otani-dl", dlDone); renderToday();
      }));
    });
    box.appendChild(l);
  }

  var total = list.length, n = list.filter(function (t) { return done.indexOf(t.id) >= 0; }).length;
  $("ptext").textContent = "Сделано " + n + " из " + total;
  var cells = $("cells"); cells.textContent = "";
  for (var ci = 0; ci < total; ci++) cells.appendChild(el("i", ci < n ? "on" : ""));
  var st = streak(), m10 = st % 10, m100 = st % 100;
  var word = (m10 === 1 && m100 !== 11) ? "день" : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? "дня" : "дней";
  $("streak").textContent = st + " " + word + " подряд";
  var wk = $("week"); wk.textContent = "";
  for (var wi = 6; wi >= 0; wi--) { var wd = addDays(now, -wi); wk.appendChild(el("i", (coreDone(wd) ? "on" : "") + (wi === 0 ? " today" : ""))); }
}

/* ---------- tabs ---------- */
function show(tab) {
  var t = tab === "table";
  $("view-today").hidden = t; $("view-table").hidden = !t;
  $("tab-today").setAttribute("aria-selected", String(!t));
  $("tab-table").setAttribute("aria-selected", String(t));
}
$("tab-today").addEventListener("click", function () { show("today"); });
$("tab-table").addEventListener("click", function () { show("table"); });

 ["Сделки в работе", ["Сделка 1: звонок клиенту раз в 7 дней, пока нет ответа", "Сделка 2: звонок до 4 декабря, получить дату решения", "У каждой сделки записан следующий шаг с датой", "Список документов клиенту в день его согласия", "Заявка на лимит готова за 10 рабочих дней после полного пакета", "Статус по сделкам руководителю каждый понедельник", "Разговор с риск-менеджером до подачи каждой заявки", "Ответ на запрос клиента в течение 24 часов"]],
 ["Предложение и цена", ["Предложение клиенту за 3 рабочих дня после встречи", "В каждом предложении 2 варианта структуры", "Таблица ставок 5 банков-конкурентов, обновление 1-го числа", "На каждой встрече 3 вопроса: ставка, срок, залог в текущем банке", "Зарплатный проект отдельным блоком в каждом предложении", "3 шаблона до 15.12: кредит, гарантия, факторинг", "Экономия клиента в цифрах в каждом предложении", "После отказа: вопрос «что решило?», ответ записан"]],
 ["Связи и репутация", ["Список 30 знакомых из банков и компаний, до 20.11", "1 обед или кофе в неделю с человеком из списка", "Профиль LinkedIn обновлён до 16.11: должность, продукты, фото", "1 пост в LinkedIn в неделю о финансировании бизнеса", "1 отраслевое мероприятие в месяц", "Сообщение с благодарностью за 24 часа после встречи", "У каждого клиента попросить 1 рекомендацию", "Раз в квартал звонок каждому из 20 главных контактов"]],

(function () {
  var m = $("mandala"), cb = el("div", "block"), i, k = 0, areas = "abcdefgh";
  cb.style.setProperty("--area", "z");
  for (i = 0; i < 9; i++) {
    if (i === 4) { var g = el("div", "cell goal", "Цель года"); g.appendChild(el("small", "", "10–15 клиентов")); cb.appendChild(g); }

/* ---------- push ---------- */
function b64ToBytes(s) {
  var p = "=".repeat((4 - s.length % 4) % 4), raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
  var out = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out;
}
function api(body) {
  return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ("Ошибка " + r.status)); return j; }); });
}
var swReg = null;
function pushUI(sub, msg) {
  var st = $("pstatus"), en = $("penable"), te = $("ptest");
  if (msg) st.textContent = msg;
  en.hidden = !!sub; te.hidden = !sub;
  if (sub && !msg) st.textContent = "Включены. Каждый день в 6:30 придёт список задач.";
}
function initPush() {
  var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!("serviceWorker" in navigator)) { $("pstatus").textContent = "Этот браузер не поддерживает уведомления."; return; }
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    swReg = reg;
    if (!("PushManager" in window) || !("Notification" in window)) {
      $("pstatus").textContent = ios && !standalone
        ? "На iPhone: в Safari нажми «Поделиться» → «На экран „Домой“», открой приложение с экрана и включи уведомления здесь."
        : "Этот браузер не поддерживает уведомления.";
      return;
    }
    return reg.pushManager.getSubscription().then(function (sub) {
      if (sub) { api({ action: "subscribe", sub: sub.toJSON() }).catch(function () {}); pushUI(sub); }
      else pushUI(null, Notification.permission === "denied"
        ? "Уведомления запрещены. Разреши их в настройках телефона для этого приложения."
        : "Выключены. Нажми кнопку, чтобы получать список задач каждое утро.");
      if (Notification.permission === "denied") $("penable").hidden = true;
    });
  }).catch(function (e) { $("pstatus").textContent = "Не удалось запустить фоновую часть: " + e.message; });
}
$("penable").addEventListener("click", function () {
  var btn = this; btn.disabled = true;
  Notification.requestPermission().then(function (p) {
    if (p !== "granted") throw new Error("Разрешение не выдано.");
    return swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID) });
  }).then(function (sub) {
    return api({ action: "subscribe", sub: sub.toJSON() }).then(function () { pushUI(sub); });
  }).catch(function (e) { pushUI(null, "Не получилось: " + e.message); })
    .then(function () { btn.disabled = false; });
});
$("ptest").addEventListener("click", function () {
  var btn = this; btn.disabled = true;
  swReg.pushManager.getSubscription().then(function (sub) {
    if (!sub) throw new Error("Подписка не найдена, включи уведомления заново.");
    return api({ action: "test", endpoint: sub.endpoint });
  }).then(function () { $("pstatus").textContent = "Отправлено. Уведомление придёт через несколько секунд."; })
    .catch(function (e) { $("pstatus").textContent = "Не получилось: " + e.message; })
    .then(function () { btn.disabled = false; });
});

/* ---------- start ---------- */
fetch("tasks.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (t) {
  TASKS = t; renderToday();
}).catch(function () { $("ptext").textContent = "Не удалось загрузить задачи. Проверь интернет и открой снова."; });
document.addEventListener("visibilitychange", function () { if (!document.hidden && TASKS) renderToday(); });
initPush();
</script>
</body>
</html>
